# Price table for metered model calls.
#
# All figures are USD per 1,000,000 tokens, the unit both OpenAI and Anthropic
# publish. `as_of` is rendered into the PR comment footer: a stale table
# producing a confident wrong number is exactly the failure the range machinery
# exists to prevent, so its age has to be visible rather than implied.
#
# VERIFY BEFORE RELEASE. These are transcribed from published pricing pages and
# providers change them without notice. Re-pin deliberately and move `as_of`
# when you do.

as_of = "2026-07-01"
stale_after_days = 90

