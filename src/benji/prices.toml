# Price table for metered model calls.
#
# USD per 1,000,000 tokens, the unit both providers publish. `as_of` is rendered
# into every comment: a stale table producing a confident wrong number is the
# failure the range machinery exists to prevent, so its age has to be visible
# rather than implied.
#
# Verified against the published pricing pages on the `as_of` date:
#   https://platform.claude.com/docs/en/about-claude/pricing
#   https://developers.openai.com/api/docs/pricing
#
# Anthropic publishes cache reads as a multiplier rather than a rate: a cache
# hit is 0.1x base input. `cached_input` below is that product, precomputed.
#
# Retired models are kept deliberately. A pull request can still change a call
# that pins one, and pricing a diff against the base commit needs the old rate.

as_of = "2026-08-18"
stale_after_days = 90

