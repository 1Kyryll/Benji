# Benji coverage corpus.
#
# Selection rule: prefer APPLICATIONS over LLM libraries. LangChain, LlamaIndex
# and LiteLLM exist to abstract the SDK; their wrapper-depth distribution is
# pathological and would skew every resolution decision we make. What we want is
# ordinary application code, where someone wrapped the SDK once in a client
# module because it was convenient.
#
# Commits are pinned so the coverage number is reproducible. SHAs below were
# each verified against the live remote on 2026-08-17 via `git ls-remote HEAD`.
# Re-pin deliberately, never automatically: an unannounced SHA bump silently
# changes the denominator and makes two coverage numbers incomparable.

schema = 1
pinned_on = "2026-08-17"

# Directory names excluded everywhere, matched against any path segment. Test
# suites and vendored trees are not the application code we are characterising,
# and fixtures full of fake calls would inflate the denominator.
[defaults]
exclude_dirs = [
  ".git",
  ".venv",
  "build",
  "dist",
  "examples",
  "migrations",
  "node_modules",
  "site-packages",
  "test",
  "testing",
  "tests",
  "venv",
]

